<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Сброс пароля — InvestApp</title>
  <link rel="stylesheet" href="reset-styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="reset-page">
  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-header">
        <div class="logo">
          <i class="fas fa-chart-line"></i>
          <h1>InvestApp</h1>
        </div>
        <h2>Сброс пароля</h2>
        <p>Введите новый пароль для вашего аккаунта</p>
      </div>

      <form id="resetForm" class="reset-form">
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input 
            type="password" 
            id="newPassword" 
            placeholder="Новый пароль (минимум 6 символов)" 
            required 
            minlength="6"
          />
          <button type="button" class="password-toggle" id="passwordToggle">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="password-strength" id="passwordStrength">
          <div class="strength-bar"></div>
          <span class="strength-text">Слабый пароль</span>
        </div>

        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input 
            type="password" 
            id="confirmPassword" 
            placeholder="Подтвердите новый пароль" 
            required 
            minlength="6"
          />
        </div>

        <button type="submit" class="btn-reset" id="btnResetPassword">
          <i class="fas fa-key"></i>
          Сменить пароль
        </button>

        <div class="reset-message" id="resetMessage"></div>
      </form>

      <div class="reset-footer">
        <p>Вспомнили пароль? <a href="login.html">Войти в аккаунт</a></p>
      </div>
    </div>
  </div>

  <script src="reset-script.js"></script>
</body>
</html>
